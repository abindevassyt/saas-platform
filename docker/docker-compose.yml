version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres
    restart: always
    environment:
      POSTGRES_USER: saas_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: saas_platform_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas_user -d saas_platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: always
    command: redis-server --requirepass redis_password_123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_password_123", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saas_network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: saas_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://saas_user:secure_password_123@postgres:5432/saas_platform_db?schema=public
      DIRECT_URL: postgresql://saas_user:secure_password_123@postgres:5432/saas_platform_db?schema=public
      REDIS_URL: redis://:redis_password_123@redis:6379/0
      JWT_ACCESS_SECRET: super_secret_jwt_access_key_minimum_32_chars_long
      JWT_REFRESH_SECRET: super_secret_jwt_refresh_key_minimum_32_chars_long
      COOKIE_SECRET: super_secret_cookie_signing_key_32_chars
      WEB_URL: http://localhost
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saas_network

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: saas_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost/api/v1
      NEXT_PUBLIC_SOCKET_URL: http://localhost
    networks:
      - saas_network

  caddy:
    image: caddy:2-alpine
    container_name: saas_edge_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - api
      - web
    networks:
      - saas_network

volumes:
  postgres_data:
  redis_data:

networks:
  saas_network:
    driver: bridge
